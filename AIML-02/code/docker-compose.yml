services:
  orthanc:
    image: orthancteam/orthanc:latest
    ports: ["8042:8042", "4242:4242"]
    environment:
      VERBOSE_ENABLED: "true"
    volumes: ["orthanc-data:/var/lib/orthanc/db"]
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports: ["8001:8000"]
    environment:
      ORTHANC_URL: http://orthanc:8042
      EDUCATION_ONLY: "true"
    depends_on: [orthanc]
volumes:
  orthanc-data:
